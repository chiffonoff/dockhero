<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Dock Hero</title>
<style>
:root{
  --ink:#f4f0ff; --sub:rgba(232,224,255,.62); --glass:rgba(18,10,40,.42);
  --line:rgba(255,255,255,.14); --purple:#9b6bff; --gold:#ffd25e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;
  font-family:"SF Pro Rounded",ui-rounded,-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  color:var(--ink);-webkit-user-select:none;user-select:none;cursor:default}
#card{position:absolute;left:12px;right:12px;bottom:12px;height:150px;border-radius:20px;overflow:hidden;background:#120a26;
  box-shadow:0 0 0 1px rgba(255,255,255,.10) inset,0 10px 26px rgba(10,0,30,.55),0 0 22px rgba(140,90,255,.30);
  transition:opacity .4s}
#card::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.06);
  background:radial-gradient(120% 140% at 50% 0%,transparent 55%,rgba(5,0,15,.45) 100%)}
canvas{position:absolute;left:0;bottom:0;image-rendering:pixelated;image-rendering:crisp-edges}
#fx{left:0;top:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;image-rendering:auto}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:overlay}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:10px;padding:8px 10px 0 8px;z-index:5}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:12px;
  -webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
#left{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 4px}
#grip{width:16px;height:22px;display:grid;place-items:center;cursor:grab;opacity:.55;border-radius:6px}
#grip:hover{opacity:1;background:rgba(255,255,255,.08)}
#grip:active{cursor:grabbing}
#grip i{display:block;width:8px;height:12px;background:radial-gradient(circle,#fff 1px,transparent 1.4px) 0 0/4px 4px}
#lvbox{display:flex;align-items:baseline;gap:2px;font-weight:800;letter-spacing:.02em}
#lvbox span{font-size:9px;color:var(--sub);font-weight:700}
#lv{font-size:15px;font-variant-numeric:tabular-nums;background:linear-gradient(#fff,#d8c6ff);-webkit-background-clip:text;color:transparent}
.bars{display:flex;flex-direction:column;gap:3px;width:118px}
.bar{position:relative;height:9px;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .25s}
.bar.hp i{background:linear-gradient(90deg,#ff5a8a,#ff8fb0);box-shadow:0 0 8px rgba(255,90,140,.7)}
.bar.hp i.low{animation:pulse .6s infinite alternate}
.bar em{position:absolute;inset:0;font-style:normal;font-size:8px;line-height:9px;text-align:center;font-weight:800;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.bar.xp{height:4px}
.bar.xp i{background:linear-gradient(90deg,#7c5cff,#c39bff);box-shadow:0 0 6px rgba(160,120,255,.8)}
@keyframes pulse{to{filter:brightness(1.6)}}

#mid{flex:1;display:flex;justify-content:center;min-width:0}
#stagebox{display:flex;align-items:center;gap:8px;height:26px;padding:0 12px}
#region{font-size:10px;color:var(--sub);font-weight:700;letter-spacing:.08em;white-space:nowrap}
#stage{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
#pips{display:flex;gap:3px}
#pips b{width:5px;height:5px;border-radius:2px;background:rgba(255,255,255,.18);transition:.2s}
#pips b.on{background:#c7a8ff;box-shadow:0 0 6px #a57bff}
#pips .bossbar{display:block;position:relative;width:90px;height:7px;border-radius:4px;background:rgba(80,10,30,.6);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,120,150,.3)}
#pips .bossbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff3d6e,#ff9a6b);box-shadow:0 0 8px #ff4d7a;transition:width .2s}
#pips b.boss{width:9px;background:rgba(255,120,120,.25)}
#pips b.boss.on{background:#ff6b8b;box-shadow:0 0 8px #ff4d7a}

#right{display:flex;align-items:center;gap:6px}
#goldbox{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 8px;min-width:84px}
.coin{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c4 0 18%,#ffd25e 30%,#e09a1a 75%);box-shadow:0 0 8px rgba(255,200,80,.7),inset 0 -1px 0 rgba(120,60,0,.5)}
#gold{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:#ffe9a8;text-shadow:0 0 8px rgba(255,200,90,.45)}
#goldbox.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.08)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.up{display:flex;align-items:center;gap:5px;height:30px;padding:0 9px 0 7px;border-radius:11px;transition:transform .12s,filter .2s,opacity .2s}
.up .ic{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:900}
.up[data-k=atk] .ic{background:linear-gradient(#ff8a7a,#e0456a)}
.up[data-k=hp] .ic{background:linear-gradient(#ff9ed0,#d94fa0)}
.up[data-k=spd] .ic{background:linear-gradient(#8fd8ff,#4b7dff)}
.up .tx{display:flex;flex-direction:column;line-height:1.05;text-align:left}
.up .tx small{font-size:8px;color:var(--sub);font-weight:700}
.up .tx b{font-size:10.5px;font-variant-numeric:tabular-nums;color:#ffe9a8}
.up:hover{transform:translateY(-1px);filter:brightness(1.2)}
.up:active{transform:translateY(1px) scale(.97)}
.up.no{opacity:.45}
.up.no .tx b{color:#ffb0b0}
.up.buy{animation:buy .35s}
@keyframes buy{30%{box-shadow:0 0 0 2px #ffd25e,0 0 18px #ffd25e}}
.tbtn{height:30px;min-width:30px;padding:0 8px;border-radius:11px;font-size:9px;font-weight:900;letter-spacing:.06em;color:var(--sub)}
.tbtn:hover{color:#fff}
#auto.on{color:#1b0f33;background:linear-gradient(#e7d6ff,#b48bff);border-color:transparent;box-shadow:0 0 12px rgba(170,120,255,.6)}
#mini{font-size:14px;line-height:1}

/* gear */
#gear{position:absolute;left:10px;bottom:7px;display:flex;gap:4px;z-index:5}
.slot{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;background:rgba(10,4,24,.55);border:1px solid rgba(255,255,255,.12);position:relative}
.slot svg{width:12px;height:12px;fill:rgba(255,255,255,.35)}
.slot.r0{border-color:#b9b3cf}.slot.r0 svg{fill:#d8d3ea}
.slot.r1{border-color:#5aa9ff;box-shadow:0 0 8px rgba(90,169,255,.5)}.slot.r1 svg{fill:#9fd0ff}
.slot.r2{border-color:#b46cff;box-shadow:0 0 9px rgba(180,108,255,.6)}.slot.r2 svg{fill:#d7b3ff}
.slot.r3{border-color:#ffc94d;box-shadow:0 0 10px rgba(255,200,80,.7)}.slot.r3 svg{fill:#ffe39a}
.slot:hover .tip{opacity:1;transform:translateY(0)}
.tip{position:absolute;left:0;bottom:26px;white-space:nowrap;font-size:10px;padding:5px 8px;border-radius:8px;opacity:0;transform:translateY(4px);transition:.15s;pointer-events:none;font-weight:700}
.tip small{display:block;color:var(--sub);font-weight:600;font-size:9px}

/* toasts */
#toasts{position:absolute;left:50%;top:44px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:6;pointer-events:none}
.toast{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;padding:5px 12px 5px 6px;border-radius:999px;white-space:nowrap;
  animation:tin .35s cubic-bezier(.2,1.4,.4,1),tout .5s 2.6s forwards}
.toast .dot{width:14px;height:14px;border-radius:50%;flex:none}
.toast b{font-weight:900}
@keyframes tin{from{opacity:0;transform:translateY(-6px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-4px)}}

/* chapter title */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:7;opacity:0}
#title.show{animation:title 3.4s ease forwards}
#title small{font-size:9px;letter-spacing:.5em;color:#d6c4ff;font-weight:800;text-shadow:0 0 10px #8a5cff}
#title h1{font-size:24px;letter-spacing:.32em;font-weight:900;margin-top:2px;padding-left:.32em;
  background:linear-gradient(180deg,#fff 30%,#c9a8ff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(160,110,255,.9))}
#title .rule{width:160px;height:1px;margin-top:6px;background:linear-gradient(90deg,transparent,#d9c2ff,transparent)}
@keyframes title{0%{opacity:0;letter-spacing:.6em}15%{opacity:1}75%{opacity:1}100%{opacity:0}}


#bagbtn{position:relative;display:grid;place-items:center;width:34px;padding:0}
#bagbtn svg{width:15px;height:15px;fill:#e6dcff}
#bagbtn.on{background:linear-gradient(#e7d6ff,#b48bff)}#bagbtn.on svg{fill:#1b0f33}
#bagbadge{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:#ff5c7a;color:#fff;font-size:9px;font-style:normal;font-weight:900;line-height:15px;box-shadow:0 0 8px #ff5c7a}
.slot{cursor:pointer}
.slot img{width:14px;height:14px;image-rendering:pixelated}
.slot img.ghost{opacity:.28;filter:grayscale(1)}
.slot.r4{border-color:#ff5c7a;box-shadow:0 0 11px rgba(255,92,122,.75)}
body.mini #bagbtn,body.mini #quit,body.mini #partybtn,body.mini #grpchip{display:none}

/* ===== panel ===== */
#panel{position:absolute;left:12px;right:12px;bottom:170px;height:314px;border-radius:20px;display:none;z-index:9;cursor:default;
  background:linear-gradient(180deg,rgba(32,18,66,.92),rgba(16,8,36,.94));border:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 30px rgba(10,0,30,.6),0 0 24px rgba(140,90,255,.28),inset 0 1px 0 rgba(255,255,255,.14);
  overflow:hidden}
.page{position:absolute;inset:12px 14px;display:none;gap:14px}
#pgear{grid-template-columns:230px minmax(0,1fr) 270px}
#pparty{grid-template-columns:minmax(0,1fr) 300px}
body.pg-gear #pgear,body.pg-party #pparty,body.pg-map #pmap,body.pg-rank #prank{display:grid}
#prank{grid-template-columns:minmax(0,1fr) 270px}
#pmap{grid-template-rows:auto 1fr auto;gap:10px}
body.panel #panel{display:block;animation:pin .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes pin{from{opacity:0;transform:translateY(10px) scale(.985)}}
#panel::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 80% at 20% 0%,rgba(150,100,255,.16),transparent 70%),radial-gradient(40% 70% at 100% 100%,rgba(255,120,200,.08),transparent 70%)}
.pcol{position:relative;display:flex;flex-direction:column;min-width:0}
.ph{display:flex;align-items:center;gap:8px;height:22px;margin-bottom:6px}
.ph b{font-size:12px;letter-spacing:.12em;font-weight:900}
.ph span{font-size:10px;color:var(--sub);font-weight:700;font-variant-numeric:tabular-nums}
.ph .sp{flex:1}
.mini-btn{font-size:10px;font-weight:800;padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#e6dcff}
.mini-btn:hover{background:rgba(255,255,255,.16)}
#pclose{position:absolute;right:10px;top:9px;width:24px;height:24px;border-radius:8px;font-size:12px;color:var(--sub);z-index:2}
#pclose:hover{background:rgba(255,255,255,.1);color:#fff}
/* equip */
.eqwrap{display:grid;grid-template-columns:44px 96px 44px;justify-content:center;grid-template-rows:44px 44px 44px;gap:6px;align-items:center;justify-items:center}
#portrait{position:static;grid-column:2;grid-row:1/3;width:96px;height:96px;image-rendering:pixelated;border-radius:14px;
  background:radial-gradient(circle at 50% 70%,rgba(160,110,255,.35),transparent 65%),linear-gradient(#2a1650,#160b30);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.cell{position:relative;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 50% 40%,var(--rc2,rgba(255,255,255,.06)),rgba(8,3,20,.6) 75%);border:1px solid var(--rc,rgba(255,255,255,.1));transition:transform .12s,box-shadow .2s}
.cell:hover{transform:translateY(-1px);box-shadow:0 0 12px var(--rc,rgba(255,255,255,.2))}
.cell img{width:28px;height:28px;image-rendering:pixelated;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
.cell img.ghost{opacity:.22;filter:grayscale(1)}
.cell .lvb{position:absolute;right:3px;top:2px;font-size:9px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
.cell .nw{position:absolute;left:4px;top:4px;width:6px;height:6px;border-radius:50%;background:#ff5c7a;box-shadow:0 0 6px #ff5c7a}
.cell .eqd{position:absolute;left:3px;bottom:2px;font-size:8px;font-weight:900;color:#ffe08a}
.cell.sel{outline:2px solid #fff;outline-offset:1px}
.cell.picked{outline:2px solid #ffd25e;outline-offset:1px}
.cell.r4{animation:myth 2.4s infinite}
@keyframes myth{50%{box-shadow:0 0 16px rgba(255,92,122,.8)}}
.cell.empty{cursor:default;opacity:.6}
.cell.empty:hover{transform:none;box-shadow:none}
#panel>.pcol:nth-of-type(1){padding-right:12px;border-right:1px solid rgba(255,255,255,.07)}
#panel>.pcol:nth-of-type(3){padding-left:12px;border-left:1px solid rgba(255,255,255,.07)}
#statlist{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:10px}
#statlist div{display:flex;justify-content:space-between;color:var(--sub);font-weight:700}
#statlist b{color:#fff;font-variant-numeric:tabular-nums}
#power{margin-left:auto;font-size:11px!important;color:#ffe08a!important;font-weight:900!important}
/* bag */
#grid{display:grid;grid-template-columns:repeat(8,minmax(30px,44px));gap:6px;justify-content:start}
#grid .cell{width:100%;height:auto;aspect-ratio:1}
#grid .cell img{width:64%;height:64%}
#detail{margin-top:9px;flex:1;border-radius:12px;padding:8px 10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);display:flex;gap:10px;min-height:0}
#detail .dn{font-size:12px;font-weight:900}
#detail .dm{font-size:10px;color:#fff;margin-top:2px;font-weight:700}
#detail .da{font-size:9.5px;color:#cbbcff;margin-top:3px;display:grid;grid-template-columns:1fr 1fr;gap:1px 10px}
#detail .cmp{font-size:10px;font-weight:900;margin-top:4px}
#detail .acts{display:flex;flex-direction:column;gap:5px;margin-left:auto;justify-content:center}
#detail .empty{color:var(--sub);font-size:10px;margin:auto}
.btn{font-size:10.5px;font-weight:900;padding:6px 12px;border-radius:9px;white-space:nowrap;color:#1b0f33;background:linear-gradient(#efe4ff,#b892ff);box-shadow:0 0 10px rgba(170,120,255,.4)}
.btn:hover{filter:brightness(1.1)}
.btn.sub{color:#e6dcff;background:rgba(255,255,255,.09);box-shadow:none;border:1px solid rgba(255,255,255,.14)}
.btn.warn{color:#fff;background:linear-gradient(#ff8fa8,#e0456a);box-shadow:0 0 10px rgba(255,80,120,.4)}
.btn:disabled{opacity:.35;filter:grayscale(.6);cursor:default}
/* forge */
.tabs{display:flex;gap:4px;padding:3px;border-radius:11px;background:rgba(0,0,0,.3);margin-bottom:8px;margin-right:30px}
.tabs button{flex:1;font-size:11px;font-weight:900;padding:5px 0;border-radius:8px;color:var(--sub)}
.tabs button.on{color:#1b0f33;background:linear-gradient(#efe4ff,#b892ff)}
#forgebody{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0}
.fhint{font-size:9.5px;color:var(--sub);text-align:center;line-height:1.45}
.altar{position:relative;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:radial-gradient(circle at 50% 50%,rgba(160,110,255,.18),rgba(0,0,0,.25) 70%);border:1px solid rgba(255,255,255,.08)}
.altar .arrow{font-size:14px;color:#cbb3ff}
.altar .res{width:50px;height:50px}
.altar.fuse .cell.in{animation:fuse .55s ease-in forwards}
@keyframes fuse{to{transform:translateX(var(--fx)) scale(.3);opacity:0}}
.rays{position:absolute;inset:-20px;border-radius:50%;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg,var(--rc,#fff) 0 6deg,transparent 6deg 24deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%)}
.rays.go{animation:rays 1.4s ease-out}
@keyframes rays{0%{opacity:0;transform:rotate(0) scale(.6)}20%{opacity:.9}100%{opacity:0;transform:rotate(90deg) scale(1.3)}}
.cost{display:flex;gap:12px;font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums}
.cost span{display:flex;align-items:center;gap:4px}
.shard{display:inline-block;width:10px;height:10px;background:linear-gradient(135deg,#bff6ff,#6be8ff 50%,#8a5cff);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);filter:drop-shadow(0 0 3px #6be8ff)}
.enhbig{display:flex;align-items:center;gap:10px}
.rate{font-size:11px;font-weight:900}
.altar.ok{animation:okfl .6s}.altar.ng{animation:shk .4s}
@keyframes okfl{30%{box-shadow:0 0 0 2px #ffd25e,0 0 30px #ffd25e}}
@keyframes shk{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.toggles{margin-top:auto;display:flex;flex-direction:column;gap:4px;width:100%}
.tg{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:800;color:#d8ccff;cursor:pointer}
.tg i{width:26px;height:15px;border-radius:8px;background:rgba(255,255,255,.14);position:relative;transition:.2s}
.tg i::after{content:"";position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:.2s}
.tg.on i{background:linear-gradient(90deg,#9b6bff,#d0a8ff);box-shadow:0 0 8px rgba(160,110,255,.7)}
.tg.on i::after{left:13px}
.salvrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}


#partybtn{display:grid;place-items:center;width:34px;padding:0}
#partybtn svg{width:16px;height:16px;fill:#e6dcff}
#partybtn.on{background:linear-gradient(#e7d6ff,#b48bff)}#partybtn.on svg{fill:#1b0f33}
#grpchip{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:900;padding:2px 7px;border-radius:8px;background:rgba(125,255,168,.14);color:#b9ffd2}
.gdot{width:6px;height:6px;border-radius:50%;background:#ffd25e;display:inline-block}
.gdot.on{background:#7dffa8;box-shadow:0 0 6px #7dffa8}.gdot.err{background:#ff5c7a}
#herotabs{display:flex;gap:4px;margin:-2px 0 6px;flex-wrap:wrap}
.htab{font-size:9.5px;font-weight:900;padding:3px 8px;border-radius:7px;color:var(--sub);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.htab.on{color:#fff;border-color:var(--cc);box-shadow:0 0 8px var(--cc);background:rgba(255,255,255,.1)}
/* party page */
.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ccard{position:relative;display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:13px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);transition:.15s;min-width:0}
.ccard:hover{background:rgba(255,255,255,.08);transform:translateY(-1px)}
.ccard.on{border-color:var(--cc);box-shadow:0 0 0 1px var(--cc) inset,0 0 14px color-mix(in srgb,var(--cc) 55%,transparent);background:color-mix(in srgb,var(--cc) 14%,transparent)}
.ccard canvas{position:static;width:52px;height:52px;flex:none;image-rendering:pixelated;border-radius:10px;background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--cc) 40%,transparent),transparent 70%),rgba(0,0,0,.25)}
.ccard .cn{font-size:12px;font-weight:900}
.ccard .cr{font-size:9px;color:var(--cc);font-weight:800;margin-top:1px}
.ccard .cd{font-size:8.5px;color:var(--sub);margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .badge{position:absolute;right:6px;top:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--cc);color:#12071f;font-size:9px;font-weight:900;line-height:16px;text-align:center}

  } else {

    const rows = [[6, 2], [5, 4], [4, 6], [4, 6], [5, 4], [6, 2]];

    if (isNew && d.b !== GAME_BUILD) setTimeout(() => toast('<b>' + String(d.name).replace(/</g, '') + '</b> とバージョンが違います。' + ((d.b || 0) < GAME_BUILD ? '相手に再起動してもらうと最新になります' : 'DockHeroを再起動すると最新になります'), '#ffd25e'), 1500);
    if (isNew && d.uid && d.uid !== G.uid && !G.friends.some(f => f.uid === d.uid)) addFriend(d.uid, d.name, true);
    if (isNew) { toast('<b>' + String(d.name).replace(/</g, '') + '</b> のパーティが仲間になった！', '#7dffa8'); grpPublish(); }
    rebuildParty(); renderParty();
  }, st => { grp.status = st; renderParty(); updHud(true); });
  mq.onReady = () => { grpPublish(); };
  mq.subscribe(TOPIC(code) + '/p/+'); mq.subscribe(TOPIC(code) + '/e');
  mq.connect();
  rebuildParty(); save(); renderParty(); updHud(true);
  toast(created ? 'グループ <b>' + code + '</b> を作りました。コードを友達に送ってね' : 'グループ <b>' + code + '</b> に参加中…', '#7dffa8');
}
function grpLeave() {
  if (mq) { mq.publish(TOPIC(grp.code) + '/p/' + grp.pid, JSON.stringify({ pid: grp.pid, leave: 1 })); const m = mq; setTimeout(() => m.close(), 300); mq = null; }
  grp.active = false; grp.code = ''; grp.peers = {}; grp.status = 'off'; G.grp = null; partyMode = 'solo';
  rebuildParty(); save(); renderParty(); updHud(true); toast('グループを抜けました', '#9b8cff');
}
setInterval(() => {
  if (!grp.active) return;
  grpPublish();
  const now = Date.now(); let ch = false;
  for (const k in grp.peers) if (now - grp.peers[k].seen > 16000) { toast((grp.peers[k].name || 'なかま') + ' との接続が切れました', '#9b8cff'); delete grp.peers[k]; ch = true; }
  if (ch) { rebuildParty(); renderParty(); }
}, 4000);
window.addEventListener('beforeunload', () => { if (grp.active && mq) mq.publish(TOPIC(grp.code) + '/p/' + grp.pid, JSON.stringify({ pid: grp.pid, leave: 1 })); });

/* ---------- window controls (native) ---------- */
let drag = null;
$('grip').addEventListener('mousedown', e => { drag = { x: e.screenX, y: e.screenY }; e.preventDefault(); });
function dragStart(e) { if (e.button !== 0 || e.target.closest('button,input,.slot,.cell,.ccard,.tg,.htab,[data-act],[data-g],.tip,#grid,#detail .acts')) return; drag = { x: e.screenX, y: e.screenY }; document.body.classList.add('dragging'); }
card.addEventListener('mousedown', dragStart); $('panel').addEventListener('mousedown', dragStart);
window.addEventListener('mousemove', e => { if (!drag) return; const dx = e.screenX - drag.x, dy = e.screenY - drag.y; if (dx || dy) { native({ t: 'move', dx, dy }); drag = { x: e.screenX, y: e.screenY }; } });
window.addEventListener('mouseup', () => { if (drag) { drag = null; document.body.classList.remove('dragging'); native({ t: 'moveEnd' }); } });
$('grip').addEventListener('dblclick', () => native({ t: 'home' }));
let mini = false;
function setMini(on) {
  if (on && panelOpen) setPanel(false);
  mini = on; document.body.classList.toggle('mini', on);
  $('mini').textContent = on ? '+' : '–'; $('mini').title = on ? '元の大きさに戻す' : '小さくする';
  native({ t: 'mini', on });
  setTimeout(resize, 60);
}
$('mini').addEventListener('click', () => setMini(!mini));
$('quit').addEventListener('click', () => { save(); native({ t: 'quit' }); toast('保存して終了します…', '#9b8cff'); });
if (!NATIVE) $('quit').style.display = 'none';
native({ t: 'hello' });
window.DH = { saveNow: save, setMini, layout: f => { document.body.classList.toggle('flip', !!f); setTimeout(resize, 50); }, onPrompt: (k, v) => { if (k === 'name') { setName(v); renderParty(); } else if (k === 'friend') { addFriend(v); } else if (k === 'code') { DH.onPaste(v); const b = document.querySelector('[data-g=join]'); if (b && ($('gcode').value || '').length === 6) b.click(); } }, onPaste: t => { const el = $('gcode'); if (el && t) { el.value = String(t).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6); } } };
window.addEventListener('beforeunload', save);
window.addEventListener('hashchange', () => {
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.has('flip')) DH.layout(q.get('flip') === '1');
  if (q.has('prompt')) DH.onPrompt(q.get('prompt'), q.get('v') || '');
  if (q.has('paste')) DH.onPaste(q.get('v') || '');
  if (q.has('update')) { toast('新しいバージョン <b>v' + q.get('update') + '</b> に更新します…', '#7dffa8'); save(); setTimeout(() => native({ t: 'reload' }), 400); }
});

/* ---------- loop ---------- */
let last = performance.now(), acc = 0, saveT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if (dt > .25) dt = .25;
  acc += dt; if (acc < 1 / 31) return;
  const step = Math.min(acc, .1); acc = 0;
  update(step); render(); updHud();
  saveT += step; if (saveT > 15) { saveT = 0; save(); }
}
load(); resize(); updGear(); updHud(true);
if (!G.name) G.name = window.__DH_USER || '';
if (G.grp && G.grp.code) setTimeout(() => grpJoin(G.grp.code, false), 1200);
setTimeout(socStart, 2000);
hero.x = 0; camX = hero.x - IW * .3;
setTimeout(chapterTitle, 250);
requestAnimationFrame(frame);
</script>
